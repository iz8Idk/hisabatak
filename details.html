<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تفاصيل الحساب</title>
<style>
body{font-family:Cairo;background:#f8fafc;padding:20px}
.container{max-width:500px;margin:auto;background:#fff;padding:20px;border-radius:20px}
img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:15px}
.btn{
  display:block;
  margin-top:15px;
  background:green;
  color:white;
  text-align:center;
  padding:15px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container" id="details"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
  "https://akymswivultpgkwcbmfl.supabase.co",
  "sb_publishable_drfYL4GqhHh8J41BQa0oWA_ghVOeJrA"
);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function load() {
  const { data } = await supabaseClient
    .from("accounts")
    .select("*")
    .eq("id", id)
    .single();

  document.getElementById("details").innerHTML = `
    <img src="${data.image}" />

    <h2>${data.username}</h2>
    <p>${data.platform}</p>
    <p>🌍 ${data.country}</p>
    <p>❤️ ${data.likes}</p>
    <p>${data.followers} متابع</p>
    <h3>${data.price} د.ك</h3>

    <a class="btn" href="https://wa.me/96566321508" target="_blank">
      تواصل واتساب
    </a>
  `;
}

load();
</script>

</body>
</html>
